      <stop offset="0" stop-color="#f6b98a"/>
      <stop offset="0.55" stop-color="#f08fa6"/>
      <stop offset="1" stop-color="#b9a0f5"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="#261925"/>
  <g transform="translate(90 90) scale(1.9) translate(-32 -32)">
    <g stroke="#fefbfa" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M32 32l12-12"/>
