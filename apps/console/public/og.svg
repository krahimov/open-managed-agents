<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Orrery: build, run and supervise AI agents">
  <defs>
    <radialGradient id="peach" cx="0.16" cy="0" r="0.62">
      <stop offset="0" stop-color="#ffe3c8"/>
      <stop offset="1" stop-color="#ffe3c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.52" cy="-0.08" r="0.6">
      <stop offset="0" stop-color="#ffdbdf"/>
      <stop offset="1" stop-color="#ffdbdf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="0.88" cy="0" r="0.62">
      <stop offset="0" stop-color="#eddfff"/>
      <stop offset="1" stop-color="#eddfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f6b98a"/>
      <stop offset="0.55" stop-color="#f08fa6"/>
      <stop offset="1" stop-color="#b9a0f5"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#261925" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas and the wash -->
  <rect width="1200" height="630" fill="#fefbfa"/>
  <rect width="1200" height="630" fill="url(#peach)"/>
  <rect width="1200" height="630" fill="url(#rose)"/>
  <rect width="1200" height="630" fill="url(#lilac)"/>

  <!-- Mark and name -->
  <g transform="translate(96 88)">
    <rect width="72" height="72" rx="21.5" fill="#261925"/>
    <g transform="translate(36 36) scale(0.81) translate(-32 -32)">
      <g stroke="#fefbfa" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M32 32l12-12"/>
        <circle cx="32" cy="32" r="17"/>
      </g>
      <circle cx="32" cy="32" r="4.5" fill="#fefbfa"/>
      <circle cx="44" cy="20" r="8" fill="url(#body)" stroke="#261925" stroke-width="3"/>
    </g>
    <text x="92" y="49" font-family="'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.6" fill="#261925">Orrery</text>
  </g>

  <!-- Headline -->
  <text x="96" y="290" font-family="'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-2.4" fill="#261925">What should your agents</text>
  <text x="96" y="376" font-family="'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-2.4" fill="#261925">work on?</text>

  <!-- A composer, the product's front door -->
  <g transform="translate(96 436)" filter="url(#soft)">
    <rect width="1008" height="104" rx="28" fill="#ffffff" stroke="#261925" stroke-opacity="0.12"/>
    <text x="36" y="62" font-family="'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#746b73">Build, run and supervise AI agents</text>
    <circle cx="952" cy="52" r="26" fill="#261925"/>
    <path d="M952 63V41m0 0l-9 9m9-9l9 9" stroke="#fefbfa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
