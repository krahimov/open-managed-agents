<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orrery</title>

    <!-- Favicon variants, all carrying the Muse mark (cream ring on an ink
         tile, the orbiting body lit by the wash). SVG is the primary icon;
         favicon.png is the 32px fallback for browsers that want a raster.
         apple-touch-icon is full-bleed and opaque, because iOS applies its
         own corner mask and would show the wallpaper through transparency.
         (No mask-icon: the mark is a filled tile, which a monochrome stencil
         would reduce to a blank square; Safari uses the icon above.) -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Browser-chrome tint. Matches --bg-sidebar (the stage behind the
         sidebar and panel) in each theme. -->
    <meta name="theme-color" content="#f7f1f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130e11" media="(prefers-color-scheme: dark)" />

    <!-- SEO: short description + canonical. The console is a single-page
         app behind auth, so canonical is the production app root — every
         in-app route shares the same indexable surface. -->
    <meta name="description" content="Orrery: build, run and supervise AI agents." />
    <link rel="canonical" href="https://app.openma.dev/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orrery" />
    <meta property="og:description" content="Build, run and supervise AI agents." />
    <meta property="og:url" content="https://app.openma.dev/" />
    <meta property="og:image" content="https://app.openma.dev/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Orrery" />

    <!-- Twitter / X large image card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orrery" />
    <meta name="twitter:description" content="Build, run and supervise AI agents." />
    <meta name="twitter:image" content="https://app.openma.dev/og.svg" />

    <!-- Turnstile is loaded on the Login page only. preconnect opens the
         TCP/TLS handshake so when the Login route mounts, the actual
         script fetch is sub-100ms. The earlier `<link rel="preload">`
         was too eager — every authenticated user lands on /agents (or
         wherever) and Chrome flagged the unused preload as a perf
         warning. preconnect alone gives 80% of the win without the
         "preloaded but not used" noise. -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <script>
      // Theme: system preference with manual override
      const t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="bg-bg-sidebar text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
